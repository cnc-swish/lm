<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>星穹文化星河 · 光学知识图谱引擎</title>
    <!-- html2canvas 截图库 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, sans-serif;
            background: #0a0c12;
            color: #f0f3fa;
        }

        /* 粒子背景 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            backdrop-filter: blur(2px);
            background: radial-gradient(circle at 20% 30%, rgba(10, 15, 30, 0.65), rgba(2, 5, 12, 0.85));
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 检索器 */
        .retriever-area {
            padding: 0.9rem 2rem 0.6rem 2rem;
            border-bottom: 1px solid rgba(80, 140, 255, 0.3);
            background: rgba(8, 12, 25, 0.5);
            backdrop-filter: blur(8px);
        }
        .retriever-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #E0F2FE, #7AA9FF, #3A7BD5);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .search-box {
            display: flex;
            gap: 8px;
            background: rgba(20, 28, 45, 0.7);
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
            border: 1px solid rgba(100, 160, 255, 0.4);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            width: 200px;
            outline: none;
        }
        .search-box button, .filter-group button {
            background: linear-gradient(95deg, #2f54eb, #1d39c4);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-group button {
            background: rgba(30, 40, 70, 0.9);
        }
        .filter-group button.active {
            background: #2f54eb;
            box-shadow: 0 0 8px #3a86ff;
        }

        /* 主体滚动区域 */
        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.5rem 1rem 1.5rem;
            scrollbar-width: thin;
        }

        /* 双栏布局 (知识库+交流库) */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .card {
            background: rgba(12, 18, 34, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(80, 140, 255, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }
        .card-header {
            padding: 1rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, rgba(36, 60, 110, 0.4), transparent);
            border-bottom: 1px solid rgba(72, 120, 255, 0.3);
        }
        .card-content {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
            max-height: 280px;
        }
        .knowledge-item, .message-item {
            background: rgba(255,255,255,0.05);
            margin-bottom: 0.7rem;
            padding: 0.7rem;
            border-radius: 18px;
            border-left: 3px solid #3a86ff;
        }
        .input-comment {
            padding: 0.8rem;
            display: flex;
            gap: 8px;
        }
        .input-comment input {
            flex: 1;
            background: #0f1625;
            border: 1px solid #2e4b7c;
            border-radius: 40px;
            padding: 8px 12px;
            color: white;
        }

        /* 效果展示区 */
        .showcase-area {
            background: rgba(8, 12, 28, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(90, 150, 255, 0.5);
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.2rem;
        }
        .stats-grid {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .stat-card {
            background: rgba(0,0,0,0.45);
            border-radius: 24px;
            padding: 8px 16px;
            text-align: center;
            flex: 1;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #6DC8FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* 新增两个区域: 文件管理 + 光学折射+xy图 */
        .new-sections {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 1.2rem;
            margin-top: 0.2rem;
        }
        .file-manager {
            background: rgba(8, 14, 28, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid #4a7eff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-header {
            padding: 0.8rem 1.2rem;
            font-weight: bold;
            background: rgba(47, 84, 235, 0.3);
            border-bottom: 1px solid #3a6eff;
        }
        .file-list {
            flex: 1;
            max-height: 280px;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .file-item {
            background: rgba(255,255,245,0.05);
            border-radius: 20px;
            margin-bottom: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .file-info {
            flex: 2;
        }
        .file-name {
            font-weight: 600;
        }
        .file-meta {
            font-size: 0.7rem;
            color: #aac8ff;
        }
        .file-actions button {
            background: #2f54eb70;
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            margin-left: 6px;
            color: white;
            cursor: pointer;
        }
        .upload-area {
            padding: 12px;
            border-top: 1px dashed #3a6eff;
            display: flex;
            gap: 12px;
        }
        .upload-area input {
            background: #0f1a2b;
            border: 1px solid #3a6eff;
            border-radius: 30px;
            padding: 6px 12px;
            color: white;
        }

        /* 光学+xy图区域 */
        .physics-mapper {
            background: rgba(8, 14, 28, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid #4a7eff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .physics-container {
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            gap: 8px;
        }
        .optics-canvas-box {
            background: #03060e;
            border-radius: 24px;
            position: relative;
            text-align: center;
        }
        canvas#refractionCanvas {
            width: 100%;
            background: radial-gradient(circle at 20% 30%, #0a1428, #01020a);
            border-radius: 20px;
            display: block;
            margin: 0 auto;
            cursor: grab;
        }
        .angle-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            font-size: 0.7rem;
            background: #03060e80;
            border-radius: 20px;
            padding: 6px 12px;
        }
        .slider-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .slider-group label {
            font-size: 0.7rem;
        }
        .scatter-area {
            margin-top: 8px;
            background: #03060e80;
            border-radius: 20px;
            padding: 6px;
        }
        .scatter-title {
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        canvas#scatterCanvas {
            width: 100%;
            background: #01020ad9;
            border-radius: 16px;
            display: block;
            margin-top: 6px;
        }
        .light-stripe {
            height: 2px;
            background: linear-gradient(90deg, transparent, #7aa9ff, #ff99cc, #7aa9ff, transparent);
            animation: lightFlow 3s infinite linear;
            background-size: 200% 100%;
        }
        @keyframes lightFlow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @media (max-width: 900px) {
            .new-sections { grid-template-columns: 1fr; gap: 1rem; }
            .two-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="app-container">
    <div class="retriever-area">
        <div class="retriever-header">
            <div class="logo"><h1>✨ 星穹文化 · 光学智库 ✨</h1><span>折射知识 · 反射价值</span></div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="检索文化知识库...">
                <button id="searchBtn">🔍 检索</button>
            </div>
            <div class="filter-group" id="filterGroup">
                <button data-filter="all" class="active">全部</button>
                <button data-filter="价值观">价值观</button>
                <button data-filter="领导力">领导力</button>
                <button data-filter="创新">创新</button>
            </div>
        </div>
        <div class="light-stripe"></div>
    </div>

    <div class="main-scroll">
        <!-- 知识库 + 交流库 -->
        <div class="two-columns">
            <div class="card">
                <div class="card-header">📚 文化知识库 · 星穹精粹</div>
                <div class="card-content" id="knowledgeListContainer"></div>
            </div>
            <div class="card">
                <div class="card-header">💬 交流库 · 思想碰撞</div>
                <div class="card-content" id="chatMessages"></div>
                <div class="input-comment">
                    <input type="text" id="commentInput" placeholder="分享文化灵感...">
                    <button id="sendCommentBtn">发布</button>
                </div>
            </div>
        </div>

        <!-- 效果展示区 (原炫酷指标) -->
        <div class="showcase-area">
            <div style="display: flex; justify-content: space-between;">
                <span style="font-weight: bold;">✨ 文化能量场 · 动态指数 ✨</span>
                <div><button class="glow-button" id="autoDemoBtn" style="background:#2f54eb; border-radius:30px; padding:4px 12px;">▶ 文化脉动</button>
                <button class="glow-button" id="screenshotBtn" style="background:#2f54eb;">📸 截存</button></div>
            </div>
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <!-- 全新区域：文件管理器 + 光学折射&xy坐标图 -->
        <div class="new-sections">
            <!-- 文件上传与列表模块 -->
            <div class="file-manager">
                <div class="file-header">📁 星穹知识资产库 · 上传 & 文件图谱</div>
                <div class="file-list" id="fileListContainer">
                    <!-- 动态文件列表 -->
                </div>
                <div class="upload-area">
                    <input type="file" id="fileUploadInput" style="flex:1;">
                    <button id="uploadFileBtn" style="background:#2f54eb; border-radius:30px; padding:0 12px;">⬆️ 上传</button>
                </div>
                <div style="font-size:10px; text-align:center; padding:4px;">点击👁️增加查阅次数 | 数据映射右图散点</div>
            </div>

            <!-- 光的反射&折射交互演示 + xy轴坐标图像 (文化知识库内容大小映射) -->
            <div class="physics-mapper">
                <div class="physics-container">
                    <div class="optics-canvas-box">
                        <canvas id="refractionCanvas" width="500" height="260" style="width:100%; height:auto; max-height:200px; aspect-ratio:500/260"></canvas>
                    </div>
                    <div class="angle-panel">
                        <span>入射角: <span id="incidentAngle">0</span>°</span>
                        <span>反射角: <span id="reflectAngle">0</span>°</span>
                        <span>折射角: <span id="refractAngle">0</span>°</span>
                        <span>临界角: <span id="criticalAngle">—</span>°</span>
                    </div>
                    <div class="slider-group">
                        <label>n₁(介质1): <input type="range" id="n1Slider" min="1.0" max="2.4" step="0.01" value="1.0"> <span id="n1Val">1.00</span></label>
                        <label>n₂(介质2): <input type="range" id="n2Slider" min="1.0" max="2.4" step="0.01" value="1.5"> <span id="n2Val">1.50</span></label>
                        <label>入射角: <input type="range" id="thetaSlider" min="0" max="85" step="1" value="35"> <span id="thetaVal">35</span>°</label>
                    </div>
                    <div class="scatter-area">
                        <div class="scatter-title">
                            <span>📈 文化知识图谱 · 文件大小 vs 查阅次数 (折射律隐喻)</span>
                            <span style="font-size:10px;">点: 文件 | 光线趋势</span>
                        </div>
                        <canvas id="scatterCanvas" width="500" height="180" style="width:100%; height:auto; background:#01020a; border-radius:16px;"></canvas>
                    </div>
                    <div style="font-size:10px; text-align:center; margin-top:4px;">斯涅耳定律 n₁·sinθ₁ = n₂·sinθ₂ | 全反射临界角动态模拟</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ----------------------------- 粒子背景（炫酷）--------------------------------
    const canvasBg = document.getElementById('particleCanvas');
    const bgCtx = canvasBg.getContext('2d');
    let width, height, particles = [];
    let mouseX = 0, mouseY = 0;
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvasBg.width = width; canvasBg.height = height; initParticles(); }
    function initParticles() { particles = []; for(let i=0;i<120;i++) { particles.push({ x:Math.random()*width, y:Math.random()*height, radius:Math.random()*2+1, vx:(Math.random()-0.5)*0.6, vy:(Math.random()-0.5)*0.4, color:`hsla(${Math.random()*40+200},80%,65%,0.5)`}); } }
    function animateBg() { if(!bgCtx) return; bgCtx.clearRect(0,0,width,height); for(let p of particles){ p.x+=p.vx; p.y+=p.vy; if(p.x<0) p.x=width; if(p.x>width) p.x=0; if(p.y<0) p.y=height; if(p.y>height) p.y=0; const dx=mouseX-p.x, dy=mouseY-p.y, dist=Math.hypot(dx,dy); if(dist<100){ let angle=Math.atan2(dy,dx); let force=(100-dist)/500; p.vx+=Math.cos(angle)*force; p.vy+=Math.sin(angle)*force; if(p.vx>1.6) p.vx=1.6; if(p.vy>1.6) p.vy=1.6; } bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.radius,0,Math.PI*2); bgCtx.fillStyle=p.color; bgCtx.shadowBlur=6; bgCtx.fill(); } requestAnimationFrame(animateBg); }
    window.addEventListener('resize',()=>{resizeCanvas();}); window.addEventListener('mousemove',(e)=>{ mouseX=e.clientX; mouseY=e.clientY;}); window.addEventListener('touchmove',(e)=>{ if(e.touches.length){ mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY;}}); resizeCanvas(); animateBg();

    // ========================== 原有知识库&交流库逻辑 =============================
    const knowledgeDB = [
        { title: "🌱 星穹价值观·共耀星辰", desc: "用户第一，创新破界，诚信利他", category: "价值观" },
        { title: "🚀 光子领导力·赋能模型", desc: "透明决策，敏捷迭代", category: "领导力" },
        { title: "💡 创新折射工作法", desc: "跨界思维与反射复盘", category: "创新" },
        { title: "📖 产业关系图谱", desc: "星穹生态协同战略", category: "价值观" },
        { title: "🏆 文化先锋故事", desc: "年度人物折射企业文化", category: "领导力" },
        { title: "🔭 未来洞察报告", desc: "技术趋势与人文思考", category: "创新" }
    ];
    let currentFilter="all", searchKeyword="";
    function renderKnowledge() {
        let filtered = knowledgeDB.filter(item => (currentFilter==="all"||item.category===currentFilter) && (!searchKeyword || item.title.includes(searchKeyword)||item.desc.includes(searchKeyword)));
        const container = document.getElementById("knowledgeListContainer");
        container.innerHTML = filtered.map(item => `<div class="knowledge-item"><div class="knowledge-title">${item.title}</div><div class="knowledge-desc">${item.desc}</div><div style="font-size:0.6rem; color:#8aa9ff;">#${item.category}</div></div>`).join("");
        if(!filtered.length) container.innerHTML = "<div style='text-align:center;padding:1rem'>✨ 未检索到文化知识</div>";
    }
    let messages = [{ name:"文化精灵·光", text:"折射定律启发了跨界创新思维 ✨", avatar:"⚡"},{ name:"星穹领航员", text:"刚刚学习了产业关系文件，非常深刻", avatar:"🌌"}];
    function renderChat(){ const container=document.getElementById("chatMessages"); container.innerHTML = messages.map(m=>`<div class="message-item"><div class="avatar">${m.avatar||"📡"}</div><div class="msg-content"><div class="msg-name">${m.name}</div><div class="msg-text">${m.text}</div></div></div>`).join(""); }
    document.getElementById("sendCommentBtn").onclick=()=>{ let val=document.getElementById("commentInput").value; if(val.trim()){ messages.unshift({name:"星穹成员", text:val, avatar:"✨"}); renderChat(); document.getElementById("commentInput").value=""; }};
    document.getElementById("searchBtn").onclick=()=>{ searchKeyword=document.getElementById("searchInput").value; renderKnowledge(); };
    document.querySelectorAll("#filterGroup button").forEach(btn=>{ btn.onclick=()=>{ document.querySelectorAll("#filterGroup button").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); currentFilter=btn.dataset.filter; renderKnowledge(); };});
    renderKnowledge(); renderChat();

    // 炫酷指标动态
    let metrics={penetration:86, vibeIndex:94, innovationHeat:79, learningEnergy:91};
    function updateStats(){ document.getElementById("statsGrid").innerHTML = `<div class="stat-card"><div class="stat-number">${metrics.penetration}%</div><div>文化渗透率</div></div><div class="stat-card"><div class="stat-number">${metrics.vibeIndex}</div><div>共鸣指数</div></div><div class="stat-card"><div class="stat-number">${metrics.innovationHeat}</div><div>创新热力</div></div><div class="stat-card"><div class="stat-number">${metrics.learningEnergy}</div><div>学习能量场</div></div>`; }
    let autoInterval=null; document.getElementById("autoDemoBtn").onclick=function(){ if(autoInterval){ clearInterval(autoInterval); autoInterval=null; this.innerHTML="▶ 文化脉动"; } else { autoInterval=setInterval(()=>{ metrics.penetration=Math.min(100,Math.max(50,metrics.penetration+(Math.random()-0.5)*6)); metrics.vibeIndex=Math.min(100,Math.max(65,metrics.vibeIndex+(Math.random()-0.5)*5)); metrics.innovationHeat=Math.min(100,Math.max(60,metrics.innovationHeat+(Math.random()-0.5)*7)); metrics.learningEnergy=Math.min(100,Math.max(70,metrics.learningEnergy+(Math.random()-0.5)*5)); updateStats(); },2000); this.innerHTML="⏸ 脉动中"; } }; updateStats();
    document.getElementById("screenshotBtn").onclick=async()=>{ let el=document.querySelector(".showcase-area"); if(el){ let canvas=await html2canvas(el,{scale:1.5}); let a=document.createElement('a'); a.download='culture-moment.png'; a.href=canvas.toDataURL(); a.click(); } };

    // ================= 文件管理 (默认三文件+上传+查看次数+散点图联动) ==================
    let filesData = [
        { id:1, name:"公司文化展示PPT.pptx", sizeKB: 2450, viewCount:58, type:"pptx" },
        { id:2, name:"企业文化PPT.pptx", sizeKB: 3170, viewCount:92, type:"pptx" },
        { id:3, name:"星穹产业关系文件.pdf", sizeKB: 1840, viewCount:34, type:"pdf" }
    ];
    let nextId = 4;
    function renderFileList() {
        const container = document.getElementById("fileListContainer");
        container.innerHTML = filesData.map(f => `
            <div class="file-item" data-id="${f.id}">
                <div class="file-info">
                    <div class="file-name">📄 ${f.name}</div>
                    <div class="file-meta">📏 ${(f.sizeKB/1024).toFixed(2)} MB  |  👁️  ${f.viewCount} 次查阅</div>
                </div>
                <div class="file-actions">
                    <button class="viewIncBtn" data-id="${f.id}">👁️ +1</button>
                </div>
            </div>
        `).join("");
        // 绑定查看次数增加事件
        document.querySelectorAll('.viewIncBtn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                const file = filesData.find(f => f.id === id);
                if(file) { file.viewCount += 1; renderFileList(); drawScatterPlot(); }
            });
        });
    }
    // 上传文件
    document.getElementById("uploadFileBtn").addEventListener("click", () => {
        const input = document.getElementById("fileUploadInput");
        if(input.files.length === 0) return;
        const file = input.files[0];
        const sizeKB = file.size / 1024;
        const newFile = {
            id: nextId++,
            name: file.name,
            sizeKB: sizeKB,
            viewCount: 0,
            type: file.name.split('.').pop()
        };
        filesData.push(newFile);
        renderFileList();
        drawScatterPlot();
        input.value = "";
    });
    // 默认三个文件渲染
    renderFileList();

    // ========== 光的反射折射交互可视化 (Canvas) + 散点图 (xy轴:文件大小(MB) vs 查看次数) ==========
    const refractCanvas = document.getElementById('refractionCanvas');
    const ctxRefract = refractCanvas.getContext('2d');
    let canvasWidth = 500, canvasHeight = 260;
    refractCanvas.width = canvasWidth; refractCanvas.height = canvasHeight;
    let n1 = 1.0, n2 = 1.5, incidentDeg = 35;
    const boundaryY = 150; // 介质分界线 y坐标
    function updateOptics() {
        const rad = incidentDeg * Math.PI/180;
        let sinTheta2 = (n1/n2) * Math.sin(rad);
        let refractDeg = 90, isTotalInternal = false;
        if(sinTheta2 > 1) { isTotalInternal = true; refractDeg = 90; }
        else { refractDeg = Math.asin(sinTheta2) * 180/Math.PI; }
        const reflectDeg = incidentDeg;
        const criticalAngleRad = (n1 > n2) ? Math.asin(n2/n1) : Math.PI/2;
        const criticalDeg = (n1 > n2) ? (criticalAngleRad*180/Math.PI) : 90;
        document.getElementById('incidentAngle').innerText = incidentDeg;
        document.getElementById('reflectAngle').innerText = reflectDeg;
        document.getElementById('refractAngle').innerText = isTotalInternal ? "全反射" : refractDeg.toFixed(1);
        document.getElementById('criticalAngle').innerText = (criticalDeg>=90? "—": criticalDeg.toFixed(1));
        drawRefraction(incidentDeg, reflectDeg, isTotalInternal ? null : refractDeg, isTotalInternal);
    }
    function drawRefraction(incident, reflect, refract, total) {
        ctxRefract.clearRect(0,0,canvasWidth,canvasHeight);
        ctxRefract.strokeStyle = "#88ccff"; ctxRefract.lineWidth=2;
        // 介质分界线
        ctxRefract.beginPath(); ctxRefract.moveTo(0,boundaryY); ctxRefract.lineTo(canvasWidth,boundaryY); ctxRefract.strokeStyle="#6c8eff"; ctxRefract.stroke();
        ctxRefract.fillStyle="#b0e0ff80"; ctxRefract.fillRect(0,boundaryY,canvasWidth,canvasHeight-boundaryY);
        ctxRefract.fillStyle="#1e2a4a80"; ctxRefract.fillRect(0,0,canvasWidth,boundaryY);
        const startX = canvasWidth/2, startY = boundaryY-5;
        const len = 100;
        const radIn = incident * Math.PI/180;
        const endIncX = startX - len * Math.sin(radIn);
        const endIncY = startY - len * Math.cos(radIn);
        // 入射线
        ctxRefract.beginPath(); ctxRefract.moveTo(startX,startY); ctxRefract.lineTo(endIncX,endIncY); ctxRefract.strokeStyle="#ffaa66"; ctxRefract.lineWidth=2.5; ctxRefract.stroke();
        // 反射线
        const radRef = reflect * Math.PI/180;
        const endRefX = startX + len * Math.sin(radRef);
        const endRefY = startY - len * Math.cos(radRef);
        ctxRefract.beginPath(); ctxRefract.moveTo(startX,startY); ctxRefract.lineTo(endRefX,endRefY); ctxRefract.strokeStyle="#66ffaa"; ctxRefract.stroke();
        // 折射线
        if(!total && refract !== null) {
            let radRefr = refract * Math.PI/180;
            let endRefrX = startX + len * Math.sin(radRefr);
            let endRefrY = startY + len * Math.cos(radRefr);
            ctxRefract.beginPath(); ctxRefract.moveTo(startX,startY); ctxRefract.lineTo(endRefrX,endRefrY); ctxRefract.strokeStyle="#66ccff"; ctxRefract.lineWidth=2.5; ctxRefract.stroke();
        } else if(total){
            ctxRefract.fillStyle="#ff8888"; ctxRefract.font="bold 14px monospace"; ctxRefract.shadowBlur=0; ctxRefract.fillText("⚡ 全反射临界", startX-50, boundaryY-15);
        }
        // 画弧线标注角度
        ctxRefract.fillStyle="#fff";
    }
    // 控制滑块
    document.getElementById('n1Slider').addEventListener('input',(e)=>{ n1=parseFloat(e.target.value); document.getElementById('n1Val').innerText=n1.toFixed(2); updateOptics(); drawScatterPlot(); });
    document.getElementById('n2Slider').addEventListener('input',(e)=>{ n2=parseFloat(e.target.value); document.getElementById('n2Val').innerText=n2.toFixed(2); updateOptics(); drawScatterPlot(); });
    document.getElementById('thetaSlider').addEventListener('input',(e)=>{ incidentDeg=parseInt(e.target.value); document.getElementById('thetaVal').innerText=incidentDeg; updateOptics(); drawScatterPlot(); });
    updateOptics();

    // ===================== xy坐标轴散点图 (文件大小(MB) vs 查看次数) 并融合光线折射律象征 ==================
    const scatterCanvas = document.getElementById('scatterCanvas');
    const scatterCtx = scatterCanvas.getContext('2d');
    let scatterWidth = 500, scatterHeight = 180;
    scatterCanvas.width = scatterWidth; scatterCanvas.height = scatterHeight;
    function drawScatterPlot() {
        scatterCtx.clearRect(0,0,scatterWidth,scatterHeight);
        scatterCtx.fillStyle = "#112233";
        scatterCtx.fillRect(0,0,scatterWidth,scatterHeight);
        // 获取最大范围进行映射 (x: 最大文件大小KB转MB, y: max viewCount)
        let maxSizeMB = Math.max(...filesData.map(f=>f.sizeKB/1024), 5);
        let maxViews = Math.max(...filesData.map(f=>f.viewCount), 1);
        let padding = 28;
        let graphW = scatterWidth - padding*2, graphH = scatterHeight - padding*2;
        // 绘制坐标轴
        scatterCtx.strokeStyle = "#7aa9ff"; scatterCtx.lineWidth=1;
        scatterCtx.beginPath(); scatterCtx.moveTo(padding, padding); scatterCtx.lineTo(padding, scatterHeight-padding); scatterCtx.lineTo(scatterWidth-padding, scatterHeight-padding); scatterCtx.stroke();
        scatterCtx.fillStyle="#bbddff"; scatterCtx.font="8px monospace";
        for(let i=0;i<=4;i++){ let xVal = (maxSizeMB * i/4).toFixed(1); let xPos = padding + (i/4)*graphW; scatterCtx.fillText(xVal+"MB", xPos-8, scatterHeight-padding+12); }
        for(let i=0;i<=4;i++){ let yVal = Math.round(maxViews * i/4); let yPos = scatterHeight-padding - (i/4)*graphH; scatterCtx.fillText(yVal, padding-18, yPos+3); }
        scatterCtx.fillStyle="#cceeff"; scatterCtx.fillText("文件大小(MB)", scatterWidth/2-30, scatterHeight-6);
        scatterCtx.save(); scatterCtx.translate(15, scatterHeight/2); scatterCtx.rotate(-Math.PI/2); scatterCtx.fillText("查阅次数", -35, 8); scatterCtx.restore();
        // 绘制数据点 + 光线折射风格连线
        let points = filesData.map(f => ({x: f.sizeKB/1024, y: f.viewCount, name: f.name}));
        points.forEach(p => {
            let px = padding + (p.x / maxSizeMB) * graphW;
            let py = scatterHeight-padding - (p.y / maxViews) * graphH;
            scatterCtx.beginPath(); scatterCtx.arc(px, py, 6, 0, 2*Math.PI); scatterCtx.fillStyle = "#ffaa66"; scatterCtx.shadowBlur=6; scatterCtx.fill();
            scatterCtx.fillStyle="white"; scatterCtx.font="bold 8px"; scatterCtx.fillText("📄", px-3, py-3);
        });
        // 利用折射率概念画一条趋势“光路” ：从原点出发经过数据重心，模拟折射/反射隐喻
        if(points.length){
            let avgX = points.reduce((a,b)=>a+b.x,0)/points.length;
            let avgY = points.reduce((a,b)=>a+b.y,0)/points.length;
            let startX = padding, startY = scatterHeight-padding;
            let endX = padding + (avgX/maxSizeMB)*graphW;
            let endY = scatterHeight-padding - (avgY/maxViews)*graphH;
            scatterCtx.beginPath(); scatterCtx.moveTo(startX,startY); scatterCtx.lineTo(endX,endY); scatterCtx.strokeStyle=`rgba(100,200,255,${0.4+Math.sin(Date.now()/1000)*0.1})`; scatterCtx.lineWidth=2; scatterCtx.setLineDash([5,6]); scatterCtx.stroke(); scatterCtx.setLineDash([]);
        }
    }
    // 监听文件变化时更新散点图
    const origPush = filesData.push; 
    window.drawScatter = drawScatterPlot;
    setInterval(()=>{ if(scatterCtx) drawScatterPlot(); }, 800);
    drawScatterPlot();
    // 监听文件列表更新
    const observer = new MutationObserver(()=>drawScatterPlot());
    observer.observe(document.getElementById("fileListContainer"), {childList:true, subtree:true});
    // 额外：当折射率或入射角改变也刷新散点图(可添加光效)
    document.getElementById('n1Slider').addEventListener('input',()=>drawScatterPlot());
    document.getElementById('n2Slider').addEventListener('input',()=>drawScatterPlot());
    // 保证所有界面统一
    window.addEventListener('resize', ()=>{ if(refractCanvas) updateOptics(); drawScatterPlot(); });
</script>
</body>
</html>

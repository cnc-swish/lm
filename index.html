<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>企业文化星河 · 沉浸式学习平台</title>
    <!-- html2canvas 库用于截图功能 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 提升炫酷感，避免大面积选中文本，但保留输入框可选 */
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;  /* 禁止全局滚动，模块内部滚动 */
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
            background: #0a0c12;
            color: #f0f3fa;
            position: relative;
        }

        /* ========= 炫酷粒子背景 Canvas ========= */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;  /* 让背景不干扰点击交互，但为了鼠标拖拽不影响，依然可点透 */
        }

        /* 主内容容器 - 玻璃质感 + 浮层 */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
            background: radial-gradient(circle at 20% 30%, rgba(10, 15, 30, 0.65), rgba(2, 5, 12, 0.85));
            overflow: hidden;
        }

        /* 顶部检索区 */
        .retriever-area {
            padding: 1.2rem 2rem 0.8rem 2rem;
            border-bottom: 1px solid rgba(80, 140, 255, 0.25);
            background: rgba(8, 12, 25, 0.4);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 3;
        }

        .retriever-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.7rem;
            background: linear-gradient(135deg, #E0F2FE, #7AA9FF, #3A7BD5);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 12px rgba(90,150,255,0.3);
        }
        .logo span {
            font-size: 0.7rem;
            color: #8AA9FF;
            letter-spacing: 1px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            background: rgba(20, 28, 45, 0.7);
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 160, 255, 0.4);
            transition: all 0.3s;
        }
        .search-box:focus-within {
            border-color: #5c9eff;
            box-shadow: 0 0 15px rgba(92,158,255,0.4);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            width: 220px;
            outline: none;
        }
        .search-box input::placeholder {
            color: #b0c4ff;
        }
        .search-box button, .filter-group button {
            background: linear-gradient(95deg, #2f54eb, #1d39c4);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-group button {
            background: rgba(30, 40, 70, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid #3a6eff;
            font-size: 0.75rem;
        }
        .filter-group button.active {
            background: #2f54eb;
            box-shadow: 0 0 8px #3a86ff;
        }

        /* 主体双栏 + 底部展示区，占用剩余高度，避免滚动条出现在body */
        .main-dashboard {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 1.8rem 1rem 1.8rem;
            gap: 1rem;
        }

        /* 知识库 + 交流库 双栏 */
        .two-columns {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            min-height: 0;  /* 防止溢出 */
        }

        /* 通用卡片样式 炫光边框 */
        .card {
            background: rgba(12, 18, 34, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(80, 140, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(120, 180, 255, 0.7);
            box-shadow: 0 20px 35px -8px rgba(0, 40, 100, 0.5);
        }

        .card-header {
            padding: 1.2rem 1.5rem;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(90deg, rgba(36, 60, 110, 0.4), transparent);
            border-bottom: 1px solid rgba(72, 120, 255, 0.3);
            letter-spacing: -0.2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header i {
            font-size: 1.5rem;
            font-style: normal;
            filter: drop-shadow(0 0 4px cyan);
        }

        .card-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.2rem;
            scrollbar-width: thin;
        }
        /* 知识库列表项 */
        .knowledge-item {
            background: rgba(255,255,255,0.05);
            margin-bottom: 0.8rem;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            border-left: 3px solid #3a86ff;
            transition: 0.2s;
            cursor: pointer;
        }
        .knowledge-item:hover {
            background: rgba(70, 130, 255, 0.2);
            transform: translateX(5px);
        }
        .knowledge-title {
            font-weight: 600;
            font-size: 1rem;
        }
        .knowledge-desc {
            font-size: 0.75rem;
            color: #b9ceff;
            margin-top: 4px;
        }

        /* 交流库 消息样式 */
        .message-item {
            display: flex;
            gap: 12px;
            margin-bottom: 1rem;
            padding: 0.6rem;
            border-radius: 20px;
            background: rgba(255,255,240,0.03);
        }
        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, #2a5f8a, #0f2b4f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 6px #6ea8fe;
        }
        .msg-content {
            flex: 1;
        }
        .msg-name {
            font-weight: bold;
            font-size: 0.8rem;
            color: #bbd9ff;
        }
        .msg-text {
            font-size: 0.8rem;
        }
        .input-comment {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        .input-comment input {
            flex: 1;
            background: #0f1625;
            border: 1px solid #2e4b7c;
            border-radius: 40px;
            padding: 8px 12px;
            color: white;
            outline: none;
        }
        .input-comment button {
            background: #2f54eb;
            border: none;
            border-radius: 40px;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 效果展示区 (炫酷数据 + 动态) */
        .showcase-area {
            background: rgba(8, 12, 28, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(90, 150, 255, 0.5);
            margin-top: 0.2rem;
            padding: 0.8rem 1.5rem;
            transition: all 0.3s;
            min-height: 180px;
        }

        .showcase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .showcase-buttons {
            display: flex;
            gap: 12px;
        }
        .glow-button {
            background: rgba(30, 60, 120, 0.7);
            border: 1px solid #5f9eff;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        .glow-button:hover {
            background: #2f54eb;
            box-shadow: 0 0 12px #2f54eb;
        }

        .stats-grid {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .stat-card {
            background: rgba(0,0,0,0.45);
            border-radius: 24px;
            padding: 12px 18px;
            text-align: center;
            flex: 1;
            min-width: 100px;
            border-bottom: 2px solid #3a86ff;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #6DC8FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        /* 炫酷流动光线装饰 */
        .light-stripe {
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #7aa9ff, #ff99cc, #7aa9ff, transparent);
            animation: lightFlow 3s infinite linear;
        }
        @keyframes lightFlow {
            0% { background-position: -200% 0; background-size: 200% 100%;}
            100% { background-position: 200% 0; background-size: 200% 100%;}
        }

        /* 响应式布局 */
        @media (max-width: 780px) {
            .retriever-area { padding: 0.8rem 1rem; }
            .two-columns { grid-template-columns: 1fr; gap: 1rem; }
            .main-dashboard { padding: 0 1rem 0.8rem 1rem; }
            .search-box input { width: 130px; }
            .logo h1 { font-size: 1.2rem; }
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1420;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a6eff;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="app-container">
    <!-- 检索器区域 (包含搜索和快速分类过滤) -->
    <div class="retriever-area">
        <div class="retriever-header">
            <div class="logo">
                <h1>✨ 星穹文化学堂 ✨</h1>
                <span>知识共振 · 价值引擎</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="检索知识库 / 文化故事...">
                <button id="searchBtn">🔍 检索</button>
            </div>
            <div class="filter-group" id="filterGroup">
                <button data-filter="all" class="active">全部</button>
                <button data-filter="价值观">价值观</button>
                <button data-filter="领导力">领导力</button>
                <button data-filter="创新">创新</button>
            </div>
        </div>
        <div class="light-stripe" style="margin-top: 12px;"></div>
    </div>

    <!-- 主体内容：知识库 & 交流库双栏 + 效果展示区 -->
    <div class="main-dashboard">
        <div class="two-columns">
            <!-- 知识库模块 -->
            <div class="card">
                <div class="card-header">
                    📚 文化知识库
                    <i>⚡ 源泉</i>
                </div>
                <div class="card-content" id="knowledgeListContainer">
                    <!-- js 动态渲染知识库条目 -->
                </div>
            </div>

            <!-- 交流库模块 -->
            <div class="card">
                <div class="card-header">
                    💬 交流库 · 思想碰撞
                    <i>🌊 动态</i>
                </div>
                <div class="card-content" id="chatMessages">
                    <!-- 动态消息展示 + 模拟发表 -->
                </div>
                <div class="input-comment" style="padding: 0 1.2rem 1rem 1.2rem;">
                    <input type="text" id="commentInput" placeholder="分享你的文化感悟...">
                    <button id="sendCommentBtn">发布</button>
                </div>
            </div>
        </div>

        <!-- 效果展示区 (炫酷指标 + 动态效果 + 截图/自动播放) -->
        <div class="showcase-area" id="showcaseArea">
            <div class="showcase-header">
                <span style="font-weight: bold; font-size: 1.2rem;">✨ 文化磁场· 成效炫彩面板 ✨</span>
                <div class="showcase-buttons">
                    <button class="glow-button" id="autoDemoBtn">▶ 文化脉动</button>
                    <button class="glow-button" id="screenshotBtn">📸 截存此刻</button>
                </div>
            </div>
            <div class="stats-grid" id="statsGrid">
                <!-- 动态数据展示 通过js刷新炫酷数字 -->
            </div>
            <div class="light-stripe" style="margin-top: 12px;"></div>
            <div style="font-size: 0.7rem; text-align: center; margin-top: 10px; opacity: 0.7;">
                <span>⭐ 文化内化指数实时模拟 | 反射组织光辉</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ======================= 粒子背景炫酷效果 (抽象光晕粒子) =======================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const PARTICLE_COUNT = 120;
    let mouseX = 0, mouseY = 0;

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.radius = Math.random() * 2.5 + 1;
            this.vx = (Math.random() - 0.5) * 0.8;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.color = `hsla(${Math.random() * 40 + 200}, 80%, 65%, ${Math.random() * 0.5 + 0.2})`;
            this.alpha = Math.random() * 0.6 + 0.2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
            // 鼠标吸引效果 — 炫酷交互
            const dx = mouseX - this.x;
            const dy = mouseY - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
                const angle = Math.atan2(dy, dx);
                const force = (120 - dist) / 800;
                this.vx += Math.cos(angle) * force;
                this.vy += Math.sin(angle) * force;
                // 限制最大速度
                let maxSpeed = 1.8;
                if (this.vx > maxSpeed) this.vx = maxSpeed;
                if (this.vy > maxSpeed) this.vy = maxSpeed;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#5f9eff";
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }
    }
    function animateParticles() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        ctx.shadowBlur = 6;
        for (let p of particles) {
            p.update();
            p.draw();
        }
        // 额外绘制流动光线（模拟光线炫彩效果，但不涉及物理折射）
        ctx.beginPath();
        for (let i=0; i<3; i++) {
            let t = Date.now() / 2000;
            let x1 = width * (0.2 + 0.6 * Math.sin(t + i));
            let y1 = height * (0.3 + 0.3 * Math.cos(t*0.7 + i));
            let x2 = width * (0.8 + 0.2 * Math.sin(t*1.3 + i));
            let y2 = height * (0.7 + 0.2 * Math.cos(t*0.9 + i));
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineWidth = 2;
            ctx.strokeStyle = `rgba(100, 180, 255, ${0.3+Math.sin(t)*0.1})`;
            ctx.shadowBlur = 12;
            ctx.stroke();
        }
        requestAnimationFrame(animateParticles);
    }

    function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initParticles();
    }
    window.addEventListener('resize', () => {
        resizeCanvas();
    });
    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });
    // 移动端触摸
    window.addEventListener('touchmove', (e) => {
        if(e.touches.length) {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        }
    });
    resizeCanvas();
    animateParticles();

    // ============= 公司文化学习平台 核心数据 ==============
    // 知识库原始数据
    const knowledgeDB = [
        { title: "🌱 核心价值观 · 客户第一", desc: "深度解读客户思维与共创价值", category: "价值观", tag: "客户" },
        { title: "🚀 创新驱动：破界思维", desc: "30+创新案例，跨行业灵感", category: "创新", tag: "创新" },
        { title: "🧠 领导力模型: 赋能团队", desc: "情境领导力与敏捷决策", category: "领导力", tag: "领导" },
        { title: "🤝 诚信合规基石", desc: "商业道德与透明文化", category: "价值观", tag: "诚信" },
        { title: "⚙️ 敏捷工作法", desc: "OKR与协同进化", category: "创新", tag: "敏捷" },
        { title: "🏆 榜样人物: 匠心故事", desc: "年度文化先锋专访", category: "领导力", tag: "榜样" }
    ];

    let currentFilter = "all";
    let searchKeyword = "";

    function renderKnowledgeBase() {
        const container = document.getElementById("knowledgeListContainer");
        let filtered = knowledgeDB.filter(item => {
            if (currentFilter !== "all" && item.category !== currentFilter) return false;
            if (searchKeyword && !item.title.includes(searchKeyword) && !item.desc.includes(searchKeyword)) return false;
            return true;
        });
        if(filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:2rem;">✨ 未找到相关文化知识，试试其他词✨</div>`;
            return;
        }
        container.innerHTML = filtered.map(item => `
            <div class="knowledge-item">
                <div class="knowledge-title">${item.title}</div>
                <div class="knowledge-desc">${item.desc}</div>
                <div style="font-size: 0.6rem; margin-top: 6px; color:#6c8eff;">#${item.category}</div>
            </div>
        `).join("");
    }

    // 交流库动态数据 (模拟讨论)
    let messages = [
        { name: "文化大使·思源", text: "今天学习了“破界思维”，团队共创太有启发了！", avatar: "🧠" },
        { name: "创新教练·晨星", text: "价值观内化打卡第二周，坚持每日反思", avatar: "⭐" },
        { name: "领航者·志远", text: "诚信分享会报名开启，欢迎大家踊跃参与", avatar: "🎤" }
    ];
    function renderChat() {
        const container = document.getElementById("chatMessages");
        container.innerHTML = messages.map(msg => `
            <div class="message-item">
                <div class="avatar">${msg.avatar || "👤"}</div>
                <div class="msg-content">
                    <div class="msg-name">${msg.name}</div>
                    <div class="msg-text">${msg.text}</div>
                </div>
            </div>
        `).join("");
        // 自动滚动到底部
        if(container) container.scrollTop = container.scrollHeight;
    }
    function addMessage(username, content) {
        if(content.trim() === "") return;
        messages.unshift({ name: username || "文化星尘", text: content, avatar: "✨" });
        renderChat();
    }

    // 效果展示区 - 酷炫指标动画  (模拟折射般的动态数值)
    let metrics = { penetration: 87, vibeIndex: 92, innovationHeat: 78, learningEnergy: 96 };
    let autoInterval = null;
    let isAutoPlaying = false;

    function updateStatsDisplay() {
        const statsDiv = document.getElementById("statsGrid");
        statsDiv.innerHTML = `
            <div class="stat-card"><div class="stat-number">${metrics.penetration}%</div><div>文化渗透率</div></div>
            <div class="stat-card"><div class="stat-number">${metrics.vibeIndex}</div><div>共鸣指数</div></div>
            <div class="stat-card"><div class="stat-number">${metrics.innovationHeat}</div><div>创新热力</div></div>
            <div class="stat-card"><div class="stat-number">${metrics.learningEnergy}</div><div>学习能量场</div></div>
        `;
    }
    // 随机波动模拟文化数据脉动
    function randomizeMetrics() {
        metrics = {
            penetration: Math.min(100, Math.max(55, metrics.penetration + (Math.random() - 0.5) * 6)),
            vibeIndex: Math.min(100, Math.max(65, metrics.vibeIndex + (Math.random() - 0.5) * 5)),
            innovationHeat: Math.min(100, Math.max(60, metrics.innovationHeat + (Math.random() - 0.5) * 7)),
            learningEnergy: Math.min(100, Math.max(70, metrics.learningEnergy + (Math.random() - 0.5) * 5))
        };
        updateStatsDisplay();
    }

    // 自动演示：每隔2.2秒刷新数据, 展现文化脉动 (类似光线跃迁)
    function startAutoDemo() {
        if(autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(() => {
            randomizeMetrics();
        }, 2200);
        isAutoPlaying = true;
    }
    function stopAutoDemo() {
        if(autoInterval) {
            clearInterval(autoInterval);
            autoInterval = null;
        }
        isAutoPlaying = false;
    }
    // 截图功能 (炫酷保存当前文化面板)
    async function takeScreenshot() {
        const element = document.querySelector(".showcase-area");
        if(!element) return;
        try {
            const canvasShot = await html2canvas(element, {
                scale: 1.8,
                backgroundColor: null,
                useCORS: false,
                logging: false
            });
            const link = document.createElement('a');
            link.download = 'culture-moment.png';
            link.href = canvasShot.toDataURL();
            link.click();
        } catch(e) {
            alert("✨ 截图功能生成中，当前环境支持完美体验~");
        }
    }

    // 检索器实时搜索与过滤交互
    document.getElementById("searchBtn").addEventListener("click", () => {
        searchKeyword = document.getElementById("searchInput").value;
        renderKnowledgeBase();
    });
    document.getElementById("searchInput").addEventListener("keyup", (e) => {
        if(e.key === "Enter") {
            searchKeyword = document.getElementById("searchInput").value;
            renderKnowledgeBase();
        }
    });
    const filterBtns = document.querySelectorAll("#filterGroup button");
    filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            filterBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.getAttribute("data-filter");
            renderKnowledgeBase();
        });
    });
    // 交流库发送消息
    document.getElementById("sendCommentBtn").addEventListener("click", () => {
        const input = document.getElementById("commentInput");
        if(input.value.trim()) {
            addMessage("文化行者", input.value);
            input.value = "";
        }
    });
    // 自动演示按钮 + 截图
    const autoBtn = document.getElementById("autoDemoBtn");
    autoBtn.addEventListener("click", () => {
        if(isAutoPlaying) {
            stopAutoDemo();
            autoBtn.innerHTML = "▶ 文化脉动";
        } else {
            startAutoDemo();
            autoBtn.innerHTML = "⏸ 脉动中";
        }
    });
    document.getElementById("screenshotBtn").addEventListener("click", takeScreenshot);
    // 额外特效: 点击任意位置模拟光效波纹（入射光效保留炫酷但不涉及折射）
    document.body.addEventListener("click", (e) => {
        let ripple = document.createElement("div");
        ripple.style.position = "fixed";
        ripple.style.pointerEvents = "none";
        ripple.style.width = "40px";
        ripple.style.height = "40px";
        ripple.style.borderRadius = "50%";
        ripple.style.background = "radial-gradient(circle, #88ccff, transparent)";
        ripple.style.left = e.clientX - 20 + "px";
        ripple.style.top = e.clientY - 20 + "px";
        ripple.style.opacity = "0.6";
        ripple.style.transition = "transform 0.6s ease, opacity 0.5s";
        ripple.style.zIndex = "9999";
        document.body.appendChild(ripple);
        setTimeout(() => {
            ripple.style.transform = "scale(4)";
            ripple.style.opacity = "0";
            setTimeout(() => ripple.remove(), 500);
        }, 10);
    });

    // 初始化所有内容
    renderKnowledgeBase();
    renderChat();
    updateStatsDisplay();
    startAutoDemo(); // 启动自动演示脉动文化数值
    // 预留给用户优雅体验，默认自动演示可随时暂停
</script>
</body>
</html>
